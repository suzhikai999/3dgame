<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <title>TEST</title>
        <style>
            *{margin:0;padding:0;box-sizing:border-box}
            body{background:#111;height:100vh;overflow:hidden}
            #canvas{display:block;width:100vw;height:100vh;border:0;background:rgb(224, 189, 49);}
            
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <script>


const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let W=window.innerWidth,H=window.innerHeight;
const fov=600;
const cam={
    x:-1450,y:210,z:-1450,
    yaw:1,pitch:-0.5,roll:2,
    speed:3,rotSpeed:0.003
};
let currentHoverFace=0;
function getDistance(a,b){
    const dx=a.x-b.x,dy=a.y-b.y,dz=a.z-b.z;
    return Math.sqrt(dx*dx+dy*dy+dz*dz);
}
function isPointInPolygon(px,py,verts){
    let inside=0;
    for(let i=0,j=verts.length-1;i<verts.length;j=i++){
        const xi=verts[i].x,yi=verts[i].y;
        const xj=verts[j].x,yj=verts[j].y;
        if((xi!=xj)&&(yi+(yj-yi)/(xj-xi)*(px-xi)>py)&&(px>xi)==(px<xj))inside=!inside;
    }
    return inside;
}
let foot=[{x:cam.x,y:cam.y,z:cam.z,xf:0,yf:0,zf:0},{x:cam.x,y:cam.y,z:cam.z,xf:0,yf:0,zf:0}],movingFoot=0;
const sceneObjects=[
    {
        points:[{x:-1500,y:0,z:-1500},{x:1500,y:0,z:-1500},{x:1500,y:220,z:-1500},{x:-1500,y:220,z:-1500}],
        color:"rgb(216, 177, 21)",normal:{x:0,y:0,z:0}},
    {
        points:[{x:-1500,y:0,z:1500},{x:1500,y:0,z:1500},{x:1500,y:220,z:1500},{x:-1500,y:220,z:1500}],
        color:"rgb(216, 177, 21)",normal:{x:0,y:0,z:0}},
    {
        points:[{x:-1500,y:0,z:-1500},{x:-1500,y:0,z:1500},{x:-1500,y:220,z:1500},{x:-1500,y:220,z:-1500}],
        color:"rgb(170, 138, 10)",normal:{x:0,y:0,z:0}},
    {
        points:[{x:1500,y:0,z:-1500},{x:1500,y:0,z:1500},{x:1500,y:220,z:1500},{x:1500,y:220,z:-1500}],
        color:"rgb(170, 138, 10)",normal:{x:0,y:0,z:0}},
    {
        points:[{x:-1500,y:0,z:-1500},{x:1500,y:0,z:-1500},{x:1500,y:0,z:1500},{x:-1500,y:0,z:1500}],
        color:"rgb(113, 100, 47)",normal:{x:0,y:0,z:0}},
    {
        points:[{x:-1500,y:220,z:-1500},{x:1500,y:220,z:-1500},{x:1500,y:220,z:1500},{x:-1500,y:220,z:1500}],
        color:"rgb(200, 200, 200)",normal:{x:0,y:0,z:0}}
];
function getWorldPolygons(){
    return sceneObjects.map(obj=>({
        po:obj.points.map(p=>({x:p.x,y:p.y,z:p.z})),
        co:obj.color,
        id:obj.id
    }));
}
function lerpPoint(p1,p2,t){
    return{
        x:p1.x+(p2.x-p1.x)*t,
        y:p1.y+(p2.y-p1.y)*t,
        z:p1.z+(p2.z-p1.z)*t
    };
}
function calcFaceNormal(poly){
    const pts=poly.po;
    if(pts.length<3){
        poly.n={x:0,y:0,z:1};
        return poly;
    }
    const p0=pts[0],p1=pts[1],p2=pts[2];
    const v1={x:p1.x-p0.x,y:p1.y-p0.y,z:p1.z-p0.z};
    const v2={x:p2.x-p0.x,y:p2.y-p0.y,z:p2.z-p0.z};
    const nx=v1.y*v2.z-v1.z*v2.y;
    const ny=v1.z*v2.x-v1.x*v2.z;
    const nz=v1.x*v2.y-v1.y*v2.x;
    const len=Math.hypot(nx,ny,nz)||1;
    poly.n={x:nx/len,y:ny/len,z:nz/len};
    sceneObjects[poly.id].normal=poly.n;
    return poly;
}
function splitPolygon(oldPoly,cutter){
    const n=cutter.n;
    const p0=cutter.po[0];
    const pts=oldPoly.po;
    const upper=[],lower=[];
    for(let i=0;i<pts.length;i++){
        const curr=pts[i];
        const next=pts[(i+1)%pts.length];
        const dc=(curr.x-p0.x)*n.x+(curr.y-p0.y)*n.y+(curr.z-p0.z)*n.z;
        const dn=(next.x-p0.x)*n.x+(next.y-p0.y)*n.y+(next.z-p0.z)*n.z;
        if(dc>0.001)upper.push(curr);else
        if(dc<-0.001)lower.push(curr);else upper.push(curr),lower.push(curr);
        if((dc>0.001&&dn<-0.001)||(dc<-0.001&&dn>0.001)){
            const t=(Math.abs(dc)+Math.abs(dn));
            upper.push(lerpPoint(curr,next,Math.abs(dc+0.5)/t));
            lower.push(lerpPoint(curr,next,Math.abs(dc-0.5)/t));
        }
    }
    return[{po:upper,co:oldPoly.co,id:oldPoly.id},{po:lower,co:oldPoly.co,id:oldPoly.id}];
}
function addOneByOne(newPoly,existing){
    const cutter=calcFaceNormal(newPoly);
    const n=cutter.n;
    const p0=cutter.po[0];
    const camD=(cam.x-p0.x)*n.x+(cam.y-p0.y)*n.y+(cam.z-p0.z)*n.z;
    const up=[],down=[];
    for(const p of existing){
        const temp=splitPolygon(p,cutter);
        if(temp[0].po.length>=3)up.push(temp[0]);
        if(temp[1].po.length>=3)down.push(temp[1]);
    }
    return camD>0?[...down,cutter,...up]:[...up,cutter,...down];
}
function build(){
    const source=getWorldPolygons();
    let scene=[];
    for(const poly of source){
        scene=addOneByOne(poly,scene);
    }
    return scene;
}
function rotate(x,y,z){
    let px=x-cam.x,py=y-cam.y,pz=z-cam.z;
    const cy=Math.cos(-cam.yaw),sy=Math.sin(-cam.yaw);
    let rx=px*cy+pz*sy,rz=-px*sy+pz*cy;
    const cp=Math.cos(-cam.pitch),sp=Math.sin(-cam.pitch);
    let ry=-(py*cp-rz*sp);rz=py*sp+rz*cp;
    const cr=Math.cos(cam.roll),sr=Math.sin(cam.roll);
    const rxf=rx*cr-ry*sr,ryf=rx*sr+ry*cr;
    return{x:rxf,y:ryf,z:rz};
}
function projectRotated(p){
    if(p.z<=0)return null;
    const s=fov/p.z;
    return{x:W/2+p.x*s,y:H/2+p.y*s};
}
function clipPolygonAgainstPlane(pts,plane){
    const out=[];
    if(!pts||pts.length===0)return out;
    for(let i=0;i<pts.length;i++){
        const a=pts[i];
        const b=pts[(i+1)%pts.length];
        const fa=plane.a*a.x+plane.b*a.y+plane.c*a.z+plane.d;
        const fb=plane.a*b.x+plane.b*b.y+plane.c*b.z+plane.d;
        const aIn=fa>=0;
        const bIn=fb>=0;
        if(aIn)out.push(a);
        if(aIn!==bIn){
            const t=fa/(fa-fb);
            const ix=a.x+(b.x-a.x)*t;
            const iy=a.y+(b.y-a.y)*t;
            const iz=a.z+(b.z-a.z)*t;
            out.push({x:ix,y:iy,z:iz});
        }
    }
    return out;
}
function clipAgainstFrustum(pts,planes){
    let res=pts.slice();
    for(const pl of planes){
        res=clipPolygonAgainstPlane(res,pl);
        if(res.length===0)break;
    }
    return res;
}
function buildFrustumPlanes(viewW,viewH,fovVal,near=0.001,far=10000){
    const hw=viewW/2;
    const hh=viewH/2;
    return[
        {a:fovVal,b:0,c:hw,d:0},
        {a:-fovVal,b:0,c:hw,d:0},
        {a:0,b:fovVal,c:hh,d:0},
        {a:0,b:-fovVal,c:hh,d:0},
        {a:0,b:0,c:1,d:-near},
        {a:0,b:0,c:-1,d:far}];
}
function resizeCanvas(){
    const w=window.innerWidth,h=window.innerHeight;
    const dpr=window.devicePixelRatio||1;
    canvas.style.width=w+'px';
    canvas.style.height=h+'px';
    canvas.width=Math.max(1,Math.floor(w*dpr));
    canvas.height=Math.max(1,Math.floor(h*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    W=w;H=h;
}
const keys={w:0,a:0,s:0,d:0,e:0,r:0};
let lock=false;
function update(){
    const fx=Math.sin(cam.yaw),fz=Math.cos(cam.yaw);
    const rx=Math.cos(cam.yaw),rz=-Math.sin(cam.yaw);
    let Move={x:0,y:0,z:0};
    if(keys.w){Move.x+=fx;Move.z+=fz;}
    if(keys.s){Move.x-=fx;Move.z-=fz;}
    if(keys.a){Move.x-=rx;Move.z-=rz;}
    if(keys.d){Move.x+=rx;Move.z+=rz;}
    if(keys.r&&nl>0)cam.speed=6,nl-=0.7;else cam.speed=3,nl+=(nl<20)?-0.3:0.3,nl=Math.min(nl,100);
    if(nl<-100)nl=100;
    if(currentHoverFace==0){
        sceneObjects[0].color="rgb(150,0,0)";
        if(keys.e)document.documentElement.innerHTML=`
<!DOCTYPE html>
<html lang="zh-CH">
<head>
    <meta charset="UTF-8">
    <title>Game Over</title>
</head>
<${`body`}>
    <p>你成功了，但可惜目前并没有制作下一层。</p>
</${`body`}>
</html>`;
    }else sceneObjects[0].color="rgb(200,0,0)";
    let onground=[0,0];
    for(const i of [0,1]){
        const f=foot[i];
        f.x+=f.xf;//f.xf*=0.9;
        f.y+=f.yf;
        f.z+=f.zf;//f.zf*=0.9;
        for(const p of sceneObjects){
            let t=(f.x-p.points[0].x)*p.normal.x+
                  (f.y-p.points[0].y)*p.normal.y+
                  (f.z-p.points[0].z)*p.normal.z;
            if(Math.abs(t)<10){
                let temp=[];
                let ax,ay,az;
                if(Math.abs(p.normal.x) < 0.9){
                    ax=1, ay=0, az=0;
                }else{
                    ax=0, ay=1, az=0;
                }
                const ux = p.normal.y * az - p.normal.z * ay;
                const uy = p.normal.z * ax - p.normal.x * az;
                const uz = p.normal.x * ay - p.normal.y * ax;
                const vx = uy * p.normal.z - uz * p.normal.y;
                const vy = uz * p.normal.x - ux * p.normal.z;
                const vz = ux * p.normal.y - uy * p.normal.x;

                for(let i=0;i<p.points.length;i++){
                    const I=p.points[i];
                    temp.push({x:(I.x-p.points[0].x)*ux+(I.y-p.points[0].y)*uy+(I.z-p.points[0].z)*uz
                            ,y:(I.x-p.points[0].x)*vx+(I.y-p.points[0].y)*vy+(I.z-p.points[0].z)*vz
                    });
                }
                const inside=isPointInPolygon((f.x-p.points[0].x)*ux+(f.y-p.points[0].y)*uy+(f.z-p.points[0].z)*uz,
                                            (f.x-p.points[0].x)*vx+(f.y-p.points[0].y)*vy+(f.z-p.points[0].z)*vz,
                                            temp);
                if(inside){
                    if(t>0)[f.x,f.y,f.z]=[f.x+p.normal.x*(10-t),f.y+p.normal.y*(10-t),f.z+p.normal.z*(10-t)];
                    else   [f.x,f.y,f.z]=[f.x-p.normal.x*(10+t),f.y-p.normal.y*(10+t),f.z-p.normal.z*(10+t)];
                    if((p.normal.y>0)==(t>0)&&Math.abs(p.normal.y)>0.01){
                        f.yf=0;
                        f.xf=0;
                        f.zf=0;
                        onground[i]=1;
                    }
                }
            }
        }
    }
    for(const f of foot){
        f.yf-=0.2*((onground[0]==0||onground[1]==0)?0.5:1);
    }
    const temp1=getDistance({x:0,y:0,z:0},Move);
    if(temp1>0.01&&onground[movingFoot]){
        const C=1.2;
        const temx=Move.x/temp1*cam.speed*12*C,temz=Move.z/temp1*cam.speed*12*C;
        foot[movingFoot].xf=(foot[1-movingFoot].x+temx-foot[movingFoot].x)/24/C;
        foot[movingFoot].yf=C;
        foot[movingFoot].zf=(foot[1-movingFoot].z+temz-foot[movingFoot].z)/24/C;
    }
    if(onground[0]&&onground[1]){
        const temp=getDistance(foot[0],foot[1]);
        if(temp>0.01){
            const A=(foot[0].x-cam.x)*Move.x+
                    (foot[0].y-cam.y)*Move.y+
                    (foot[0].z-cam.z)*Move.z;
            const B=(foot[1].x-cam.x)*Move.x+
                    (foot[1].y-cam.y)*Move.y+
                    (foot[1].z-cam.z)*Move.z;
            if(A<B)movingFoot=0;
            else movingFoot=1;
        }
        if(temp>70)foot[0].x=foot[1].x=cam.x,
                foot[0].y=foot[1].y=cam.y-50,
                foot[0].z=foot[1].z=cam.z;
        if(temp1<0.01){
            foot[0].x-=(foot[0].x-foot[1].x)/10;
            foot[0].z-=(foot[0].z-foot[1].z)/10;
            foot[1].x-=(foot[1].x-foot[0].x)/10;
            foot[1].z-=(foot[1].z-foot[0].z)/10;
        }
    }
    if(Math.abs(foot[0].yf+foot[1].yf)<3)cam.roll-=Math.sin((cam.roll)/20);else cam.roll+=cam.roll/50;
    cam.roll-=( Move.x*rx+Move.z*rz )/100;
    cam.x=(foot[0].x+foot[1].x)/2;
    cam.y=(foot[0].y+foot[1].y)/2+50;
    cam.z=(foot[0].z+foot[1].z)/2;
}
let lastTime=0;
function draw(polygons){
    ctx.fillStyle="#000";
    ctx.fillRect(0,0,W,H);
    ctx.save();
    ctx.imageSmoothingEnabled=false;
    const near=1,far=10000;
    const frustumPlanes=buildFrustumPlanes(W,H,fov,near,far);
    const centerX=W/2;
    const centerY=H/2;
    currentHoverFace=-1;
    for(const f of polygons){
        const rotated=f.po.map(v=>rotate(v.x,v.y,v.z));
        const clipped=clipAgainstFrustum(rotated,frustumPlanes);
        if(clipped.length<3)continue;
        const pts=[];
        for(const v of clipped){
            const s=projectRotated(v);
            if(!s)continue;
            pts.push(s);
        }
        if(pts.length<3)continue;
        if(isPointInPolygon(centerX,centerY,pts))currentHoverFace=f.id;
        ctx.beginPath();
        ctx.moveTo(pts[0].x,pts[0].y);
        for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
        ctx.closePath();
        ctx.fillStyle=f.co;
        ctx.fill();
    }
                ctx.save();
                for (let i = 0; i < 2; i++) {
                    const f = foot[i];
                    const r = rotate(f.x, f.y, f.z);
                    const scr = projectRotated(r);
                    if (scr) {
                        ctx.beginPath();
                        ctx.arc(scr.x, scr.y, 6, 0, Math.PI * 2);
                        ctx.fillStyle = i === movingFoot 
                        ?'#004' 
                        :'#400';
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
                ctx.restore();
    ctx.beginPath();
    ctx.arc(centerX,centerY,2,0,Math.PI*2);
    ctx.fillStyle='#fff';
    ctx.fill();
    const now=performance.now();
    const fps=(1000/(now-lastTime)).toFixed(1);
    lastTime=now;
    ctx.fillStyle="#fff";
    ctx.font="14px monospace";
    ctx.fillText(`FPS:${fps}`,10,60);
    ctx.fillText(`Faces:${polygons.length}`,10,80);
    ctx.fillText(`BaseFaces:${sceneObjects.length}`,10,100);
    if(currentHoverFace!=-1)ctx.fillText(`HoverFace:${currentHoverFace}    ${sceneObjects[currentHoverFace].normal.x},${sceneObjects[currentHoverFace].normal.y},${sceneObjects[currentHoverFace].normal.z}`,10,120);
    ctx.fillText(`x:${Math.round(cam.x*10)/10},`,10,140);
    ctx.fillText(`y:${Math.round(cam.y*10)/10},`,80,140);
    ctx.fillText(`z:${Math.round(cam.z*10)/10},`,150,140);
    ctx.fillText(`yf:${Math.round(foot[0].yf*10)/10} `,210,140);
    ctx.fillText(`nl:${nl} `,10,160);
    ctx.font="25px monospace";
    ctx.restore();
}
let nl=100;
let eve={watchEmpty:0,b:0};
function loop(){
    update();
    let i=0;
    for(const f of sceneObjects){
        f.id=i;
        i++;
    }
    const polygons=build();
    draw(polygons);
    requestAnimationFrame(loop);
}
document.addEventListener('keydown',e=>{if(keys[e.key]!==undefined)keys[e.key]=true});
document.addEventListener('keyup',e=>{if(keys[e.key]!==undefined)keys[e.key]=false});
canvas.addEventListener('click',()=>canvas.requestPointerLock());
document.addEventListener('pointerlockchange',()=>lock=document.pointerLockElement===canvas);
document.addEventListener('mousemove',e=>{
    if(!lock)return;
    cam.yaw+=e.movementX*cam.rotSpeed;
    cam.pitch+=e.movementY*cam.rotSpeed;
    cam.pitch=Math.max(-Math.PI/2+0.1,Math.min(Math.PI/2-0.1,cam.pitch));
    cam.roll-=e.movementX*cam.rotSpeed/3;
});
window.addEventListener('resize',resizeCanvas);
resizeCanvas();
function Init(){
    for(let i=-1400;i<1400;i+=500){
        for(let j=-1400;j<1400;j+=500){
            const X=i,Z=j;
            if(Math.random()>0.5)sceneObjects.unshift({
                points:[{x:X,y:0,z:Z},{x:X+450,y:0,z:Z},{x:X+450,y:200,z:Z},{x:X,y:200,z:Z}]
                ,color:`rgb(${224+Math.random()*5}, ${189+Math.random()*5}, ${49+Math.random()*5})`,normal:{x:0,y:0,z:0},id:0
            });else
            sceneObjects.unshift({
                points:[{x:X,y:0,z:Z},{x:X,y:0,z:Z+450},{x:X,y:200,z:Z+450},{x:X,y:200,z:Z}]
                ,color:`rgb(${224+Math.random()*5}, ${189+Math.random()*5}, ${49+Math.random()*5})`,normal:{x:0,y:0,z:0},id:0
            });
        }
    }
    const X=Math.random()*2900-1450,Z=Math.random()*2900-1450;
    sceneObjects.unshift({
        points:[{x:X,y:30,z:Z},{x:X+30,y:30,z:Z},{x:X+30,y:30,z:Z+30},{x:X,y:30,z:Z+30}],
        color:"rgb(100,100,100)",normal:{x:0,y:0,z:0},id:0
    });
    sceneObjects.unshift({
        points:[{x:X,y:0,z:Z},{x:X,y:0,z:Z+30},{x:X,y:30,z:Z+30},{x:X,y:30,z:Z}],
        color:"rgb(105,105,105)",normal:{x:0,y:0,z:0},id:0
    });
    sceneObjects.unshift({
        points:[{x:X+30,y:0,z:Z},{x:X+30,y:0,z:Z+30},{x:X+30,y:30,z:Z+30},{x:X+30,y:30,z:Z}],
        color:"rgb(105,105,105)",normal:{x:0,y:0,z:0},id:0
    });
    sceneObjects.unshift({
        points:[{x:X,y:0,z:Z},{x:X+30,y:0,z:Z},{x:X+30,y:30,z:Z},{x:X,y:30,z:Z}],
        color:"rgb(110,110,110)",normal:{x:0,y:0,z:0},id:0
    });
    sceneObjects.unshift({
        points:[{x:X,y:0,z:Z+30},{x:X+30,y:0,z:Z+30},{x:X+30,y:30,z:Z+30},{x:X,y:30,z:Z+30}],
        color:"rgb(110,110,110)",normal:{x:0,y:0,z:0},id:0
    });
    sceneObjects.unshift({
        points:[{x:X+5,y:32,z:Z+5},{x:X+25,y:32,z:Z+5},{x:X+25,y:32,z:Z+25},{x:X+5,y:32,z:Z+25}],
        color:"rgb(200,0,0)",normal:{x:0,y:0,z:0},id:0
    });
    loop();
}
Init();


</script>
